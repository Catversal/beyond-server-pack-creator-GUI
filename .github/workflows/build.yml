name: Build & Release ServerPackCreator

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger from GitHub

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  #  Windows Build → ServerPackCreator.exe
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller ServerPackCreator.spec --clean

      - name: Zip the output
        run: |
          Compress-Archive -Path dist/ServerPackCreator/* -DestinationPath ServerPackCreator-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerPackCreator-Windows
          path: ServerPackCreator-Windows.zip

  # ──────────────────────────────────────────────
  #  Linux Build → ServerPackCreator (binary)
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 \
            libxcb-xinerama0 libxcb-cursor0 \
            libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller ServerPackCreator.spec --clean

      - name: Zip the output
        run: |
          cd dist
          tar -czf ../ServerPackCreator-Linux.tar.gz ServerPackCreator/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerPackCreator-Linux
          path: ServerPackCreator-Linux.tar.gz

  # ──────────────────────────────────────────────
  #  Create GitHub Release with both builds
  # ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ServerPackCreator-Windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ServerPackCreator-Linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ServerPackCreator ${{ github.ref_name }}"
          body: |
            ## ServerPackCreator ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `ServerPackCreator-Windows.zip` |
            | 🐧 Linux   | `ServerPackCreator-Linux.tar.gz` |

            ### How to use
            **Windows:** Extract the zip, run `ServerPackCreator.exe`
            **Linux:** Extract the tar.gz, run `./ServerPackCreator/ServerPackCreator`

            > ⚠️ Java 17–21 must be installed for Forge server installation.
          files: |
            ServerPackCreator-Windows.zip
            ServerPackCreator-Linux.tar.gz
          draft: false
          prerelease: false
